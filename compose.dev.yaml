# Exclusivamente para pruebas locales: docker compose -f compose.yaml -f compose.dev.yaml up -d --build
services:
  api-turnos:
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports: !override
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
  frontend:
    ports: !override
      - "${FRONTEND_HOST:-0.0.0.0}:${FRONTEND_PORT:-5173}:80"
